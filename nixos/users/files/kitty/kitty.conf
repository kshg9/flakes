# kitty.conf — the baked-in, non-color base config, managed by hjem.
# Colors live in their own file (colors.conf) that we import from the same
# .config dir — so the palette can be swapped/re-generated separately (noctalia
# theme change, a colorscheme reload) without touching this base.
include colors.conf

font_family CommitMono Nerd Font Mono
font_size 14.000000

active_tab_font_style bold
active_tab_title_template ({index}) {title}
allow_remote_control socket-only
background_blur 2
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes
inactive_tab_font_style normal
linux_display_server wayland
listen_on unix:/tmp/kitty
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style angled
tab_title_template [{index}] {title}
window_padding_width 8

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up move_tab_backward
map ctrl+t new_tab
map ctrl+w close_tab
