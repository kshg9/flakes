# kanagawa-transparent: built-in kanagawa, but with the solid background scopes
# unset so the terminal's own background (kitty `background 0` / translucent
# window / background image) shows through. `{ }` means "no style override" →
# no background is painted. Keys that don't exist in the base theme are ignored.
inherits = "kanagawa"

# Kill the big opaque surfaces first.
"ui.background" = {}
"ui.gutter" = {}
"ui.cursor" = {}
"ui.cursorline" = {}

# Panels / floating UI drop their solid fill.
"ui.popup" = {}
"ui.menu" = {}
"ui.completion" = {}
"ui.hover" = {}

# Line-number / virtual rulings lose their filled background.
"ui.linenr" = {}
"ui.linenr.selected" = {}
"ui.virtual.ruler" = {}
"ui.virtual.inlay-hint" = {}

# Status/buffer lines still readable on the (transparent) background.
"ui.bufferline" = {}
"ui.statusline" = {}
"ui.statusline.inactive" = {}